<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    header,footer{
        background-color: black;
        color: azure;
        text-align: center;
    }
    
    .CONTAINER{
        display: flex;
        flex-direction: column;
        gap:10px
    }
    .MAIN,.SIDE{
        background-color: gainsboro;
        padding: 10px;;
    }
    @media(min-width:600px)and (max-width:900px){
        .CONTAINER{
            flex-direction: row;
        }
        .MAIN{
            flex:1;
        }
        .SIDE{
            flex:1;
        }
    }
    @media(min-width:900px){
        .CONTAINER{
            flex-direction: row;
        }
        .MAIN{
            flex:3;
        }
        .SIDE{
            flex:1;
        }
    }
    

</style>
<body>

    <header>
        <h2>Responsive Header</h2>
    </header>
 <div class="CONTAINER">
    <div class="MAIN">
        <h3>Main Content</h3>
    </div>

    <div class="SIDE">
        <h3>Sidebar</h3>
    </div>
 </div>

    <footer>
         <h2>Footer</h2>
    </footer>

 </div>
</body>
</html>
